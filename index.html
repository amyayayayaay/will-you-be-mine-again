<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Will You Be My Boyfriend Again?</title>
  <style><iframe src="https://docs.google.com/forms/d/e/1FAIpQLSeFrCrHyobKC4e-0EkMpD3EHJxUKFwNoaNEbZ4e_mIJLr19xg/viewform?embedded=true" width="640" height="422" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
    body {
      background: linear-gradient(to right, #ffc0cb, #ffe4e1);
      font-family: 'Arial', sans-serif;
      color: #800040;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      text-align: center;
    }
    h1 {
      font-size: 2em;
      margin-bottom: 20px;
    }
    p {
      font-size: 1.2em;
      margin-bottom: 30px;
    }
    label {
      display: block;
      font-size: 1.1em;
      margin: 10px 0;
    }
    .button {
      margin-top: 30px;
      font-size: 1em;
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      background-color: #ff69b4;
      color: white;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .button:hover {
      background-color: #ff1493;
    }
    .heart {
      font-size: 2em;
      color: red;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="heart">❤️</div>
    <h1>Will You Be My Boyfriend Again?</h1>
    <p>I'm really sorry for breaking up. I miss you, and I realize now how much you mean to me. Would you give us another chance?</p>
    <form>
      <label>
        <input type="radio" name="answer" value="yes" />
        Yes, I'd love to ❤️
      </label>
      <label>
        <input type="radio" name="answer" value="no" />
        No, sorry 😔
      </label>
      <button type="submit" class="button">Submit</button>
    </form>
  </div>
</body>
</html>
